# =============================================================================
# GraphRAG 跨段落抽取配置示例
# =============================================================================
# 将本文件中需要的片段合并到你自己的 GraphRAG 项目根目录下的 settings.yml 中
# （GraphRAG 项目通常在另一目录，如 E:\graphrag\graphrag-2.7.0\你的数据项目）
#
# 作用：让实体与关系更多跨段落/跨块出现，减轻「散点」、增加连通性
# 修改后需在 GraphRAG 项目里重新执行 graphrag index，再使用 convert_graphrag_to_neo4j.py 转 CSV
# =============================================================================

# -----------------------------------------------------------------------------
# 1. 分块 (chunks) —— 影响「段落边界」与跨块上下文
# -----------------------------------------------------------------------------
chunks:
  # 每个文本块的最大 token 数。调大后，一个块内包含更多段落，模型有更多上下文做跨段落抽取
  # 默认常为 300；官方示例中 1200 也表现良好。建议先试 600～800，再视效果调到 1000～1200
  size: 800

  # 相邻块之间的重叠 token 数。有重叠时，同一段内容会出现在多个块中，有利于：
  # - 同一实体在多块中被识别并合并
  # - 跨块的关系被后续 gleaning 或合并阶段抓住
  # 默认多为 0；建议 50～100
  overlap: 80

  # 分块策略：tokens（按 token 切）或 sentences（按句切）
  strategy: tokens

  # 若你的数据是按文档/章节组织的，可设置按某一列分组再分块，使「段落」更符合业务
  # group_by_columns: ["id"]   # 按文档 id 分组后各自分块，避免不同文档混在同一块

# -----------------------------------------------------------------------------
# 2. 图抽取 (extract_graph) —— 影响多轮补全与跨块关系
# -----------------------------------------------------------------------------
extract_graph:
  #  Gleaning 轮数：每轮会在上一轮实体/关系基础上再做一轮抽取，能发现更多跨块、跨句关系
  #  默认多为 1；增加到 2 或 3 可明显提升跨段落实体与关系数量（耗时会成倍增加）
  max_gleanings: 2

  # 以下若你已在 settings 里配置过，保持不变即可
  # model_id: default_chat_model
  # prompt: prompts/extract_entities_and_relationships.txt
  # entity_types: []   # 若用 --discover-entity-types，这里可留空或按需写死类型

# -----------------------------------------------------------------------------
# 3. 可选：输入与分组，让「段落」更贴合你的数据
# -----------------------------------------------------------------------------
# input:
#   file_type: csv
#   text_column: text
#   title_column: title
#   metadata: []   # 按需保留元数据列

# 若希望「一个文档 = 多块、但块尽量不跨文档」，可在 chunks 里设置：
# chunks:
#   group_by_columns: ["id"]   # 或你的文档 id 列名
